[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferdilegend"
version = "0.3.0"
description = "Telegram botları, userbot'lar, grup/kanal scraper ve çeşitli tool'lar için hafif ve güçlü Python paketi."
readme = "README.md"
authors = [{ name = "FerdiLegend" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["telegram", "userbot", "scraper", "telethon", "pyrogram"]

dependencies = [
    "telethon>=1.36.0",
    "pyrogram>=2.1.0",
    "tgcrypto>=1.2.0",
    "rich>=13.7.0",
    "pyfiglet>=0.8.post1",
    "colorama>=0.4.6",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ferdilegend*"]
