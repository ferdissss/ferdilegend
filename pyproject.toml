[project]
name = "ferdilegend"
version = "0.3.0"
description = "Telegram botları, userbot'lar, grup/kanal scraper ve çeşitli tool'lar için hafif ve güçlü Python paketi."
readme = "README.md"
authors = [{ name = "FerdiLegend" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["telegram", "userbot", "scraper", "telethon", "pyrogram"]

dependencies = [
    "telethon>=1.36.0",
    "pyrogram>=2.1.0",
    "tgcrypto>=1.2.0",
    "rich>=13.7.0",
    "pyfiglet>=0.8.post1",
    "colorama>=0.4.6",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["black", "isort", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
